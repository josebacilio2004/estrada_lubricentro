name: CI/CD Pipeline - Estrada Ecosystem

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-lint-and-test:
    name: Backend CI (Golang 1.23)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: backend/go.sum

      - name: Download Go Modules
        working-directory: ./backend
        run: go mod download

      - name: Verify Go Module Tidiness
        working-directory: ./backend
        run: go mod verify

      - name: Run Unit Tests
        working-directory: ./backend
        run: go test -v -race -coverprofile=coverage.out ./...

  frontend-lint-and-build:
    name: Frontend CI (Next.js 14)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Type Check TypeScript
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Build Next.js Application
        working-directory: ./frontend
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_API_URL: http://localhost:8080/v1

  docker-compose-validate:
    name: Docker Infrastructure Check
    runs-on: ubuntu-latest
    needs: [backend-lint-and-test, frontend-lint-and-build]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Copy Environment Template
        run: cp .env.example .env

      - name: Validate Docker Compose Configuration
        run: docker compose config --quiet

      - name: Build Backend Docker Image
        run: docker build -t estrada-backend:test ./backend

      - name: Build Frontend Docker Image
        run: docker build -t estrada-frontend:test ./frontend
